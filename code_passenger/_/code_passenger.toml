[language]
id = "rust"          # rust | ts | py | go | c | etc
pack = "builtin"     # builtin or "dynamic" later

[header_plan]
id = "verbose"       # verbose | compact | audit

[scaffold_plan]
id = "rust_std_mod"  # your style

[rules]
# optional: map deps -> features (overrides inferred manifest mapping)
dep_to_feature = { tokio = "async", async_trait = "async", serde_json = "json" }

# optional: ignore
ignore_paths = ["target", "tests/fixtures"]